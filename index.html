};

const fmt = (v) => "£" + parseFloat(v || 0).toFixed(2);
const addDays = (dateStr, n) => { const d = new Date(dateStr); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const displayDate = (dateStr) => {
  const today = new Date().toISOString().slice(0,10);
  if (dateStr === today) return "Today";
  if (dateStr === addDays(today,1)) return "Tomorrow";
  if (dateStr === addDays(today,-1)) return "Yesterday";
  return new Date(dateStr).toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" });
};

function calcPnl(bet) {
  const stake = parseFloat(bet.stake||0), returns = parseFloat(bet.returns||0);
  if (bet.status==="Won"||bet.status==="Cash Out") return returns-stake;
  if (bet.status==="Lost") return bet.freeBet?0:-stake;
  return null;
}

function calcStats(bets) {
  const settled = bets.filter(b=>["Won","Lost","Cash Out"].includes(b.status));
  const won = bets.filter(b=>b.status==="Won");
  const cashStaked = bets.filter(b=>!b.freeBet).reduce((s,b)=>s+parseFloat(b.stake||0),0);
  const freeStaked = bets.filter(b=>b.freeBet).reduce((s,b)=>s+parseFloat(b.stake||0),0);
  const pnl = bets.reduce((s,b)=>{ const p=calcPnl(b); return s+(p!==null?p:0); },0);
  const winRate = settled.length?((won.length/settled.length)*100).toFixed(0):0;
  return { total:bets.length, cashStaked, freeStaked, pnl, winRate, won:won.length, settled:settled.length };
}

// Build running P&L data for chart
function buildChartData(bets) {
  const settled = bets
    .filter(b => ["Won","Lost","Cash Out"].includes(b.status) && b.date)
    .sort((a,b) => new Date(a.date) - new Date(b.date));
  let running = 0;
  const points = [{ date: "Start", pnl: 0 }];
  settled.forEach(b => {
    const p = calcPnl(b);
    if (p !== null) {
      running += p;
      points.push({
        date: new Date(b.date).toLocaleDateString("en-GB", { day:"numeric", month:"short" }),
        pnl: parseFloat(running.toFixed(2)),
        bet: b.match
      });
    }
  });
  return points;
}

// ── P&L Chart ─────────────────────────────────────────────────────────────────
function PnlChart({ bets, deposited, onUpdateDeposited }) {
  const [editingDeposit, setEditingDeposit] = useState(false);
  const [depositInput, setDepositInput] = useState(String(deposited));
  const [tooltip, setTooltip] = useState(null);
  const data = useMemo(() => buildChartData(bets), [bets]);
  const currentPnl = data.length > 1 ? data[data.length-1].pnl : 0;
  const isPositive = currentPnl >= 0;
  const balance = deposited + currentPnl;

  const saveDeposit = () => {
    const val = parseFloat(depositInput);
    if (!isNaN(val) && val >= 0) onUpdateDeposited(val);
    setEditingDeposit(false);
  };

  const W = 520, H = 160, PAD = { top:10, right:10, bottom:24, left:48 };
  const innerW = W - PAD.left - PAD.right;
  const innerH = H - PAD.top - PAD.bottom;

  const svgChart = useMemo(() => {
    if (data.length < 2) return null;
    const vals = data.map(d => d.pnl);
    const minV = Math.min(...vals, 0);
    const maxV = Math.max(...vals, 0);
    const range = maxV - minV || 1;
    const xScale = i => PAD.left + (i / (data.length-1)) * innerW;
    const yScale = v => PAD.top + innerH - ((v - minV) / range) * innerH;
    const zeroY = yScale(0);
    const pts = data.map((d,i) => xScale(i)+","+yScale(d.pnl)).join(" ");
    const areaPath = "M"+xScale(0)+","+zeroY+" L"+data.map((d,i)=>xScale(i)+","+yScale(d.pnl)).join(" L")+" L"+xScale(data.length-1)+","+zeroY+" Z";
    const color = isPositive ? "#4ade80" : "#f87171";
    const fillId = isPositive ? "greenFill" : "redFill";
    // Y axis ticks
    const ticks = [];
    const step = range <= 5 ? 1 : range <= 20 ? 5 : range <= 100 ? 20 : 50;
    const start = Math.ceil(minV / step) * step;
    for (let v = start; v <= maxV; v += step) ticks.push(v);
    return { pts, areaPath, zeroY, color, fillId, ticks, xScale, yScale, minV, maxV, range };
  }, [data, isPositive]);

  return (
    <div style={{background:"#111827",border:"1px solid #1e293b",borderRadius:12,padding:22,marginBottom:22}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"start",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontSize:12,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>P&L Over Time</div>
          <div style={{fontSize:28,fontWeight:700,color:isPositive?"#4ade80":"#f87171"}}>{(isPositive?"+":"")+fmt(currentPnl)}</div>
        </div>
        <div style={{display:"flex",gap:16}}>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Cash Deposited</div>
            {editingDeposit ? (
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <input type="number" step="0.01" value={depositInput} onChange={e=>setDepositInput(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&saveDeposit()}
                  style={{background:"#0b0e14",border:"1px solid #2563eb",borderRadius:6,padding:"4px 8px",color:"#f1f5f9",fontSize:13,width:90}} autoFocus />
                <button onClick={saveDeposit} style={{background:"#2563eb",border:"none",borderRadius:6,color:"#fff",padding:"4px 10px",fontSize:11,cursor:"pointer"}}>Save</button>
              </div>
            ) : (
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{fontSize:18,fontWeight:700,color:"#f1f5f9"}}>{fmt(deposited)}</div>
                <button onClick={()=>{setEditingDeposit(true);setDepositInput(String(deposited));}} style={{background:"#1e293b",border:"none",borderRadius:5,color:"#64748b",padding:"3px 8px",fontSize:10,cursor:"pointer"}}>Edit</button>
              </div>
            )}
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Balance</div>
            <div style={{fontSize:18,fontWeight:700,color:balance>=deposited?"#4ade80":"#f87171"}}>{fmt(balance)}</div>
          </div>
        </div>
      </div>

      {data.length < 2 ? (
        <div style={{textAlign:"center",padding:"30px 0",color:"#334155",fontSize:13}}>Settle some bets to see your P&L chart</div>
      ) : (
        <div style={{position:"relative"}}>
          <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:"auto",display:"block"}}>
            <defs>
              <linearGradient id="greenFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#4ade80" stopOpacity="0.25"/>
                <stop offset="100%" stopColor="#4ade80" stopOpacity="0"/>
              </linearGradient>
              <linearGradient id="redFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#f87171" stopOpacity="0.25"/>
                <stop offset="100%" stopColor="#f87171" stopOpacity="0"/>
              </linearGradient>
            </defs>
            {/* Y axis ticks */}
            {svgChart.ticks.map(v=>(
              <g key={v}>
                <line x1={PAD.left} y1={svgChart.yScale(v)} x2={W-PAD.right} y2={svgChart.yScale(v)} stroke="#1e293b" strokeWidth="1"/>
                <text x={PAD.left-4} y={svgChart.yScale(v)+4} textAnchor="end" fill="#475569" fontSize="9">{"£"+v}</text>
              </g>
            ))}
            {/* Zero line */}
            <line x1={PAD.left} y1={svgChart.zeroY} x2={W-PAD.right} y2={svgChart.zeroY} stroke="#334155" strokeWidth="1" strokeDasharray="4 3"/>
            {/* Area fill */}
            <path d={svgChart.areaPath} fill={"url(#"+svgChart.fillId+")"} />
            {/* Line */}
            <polyline points={svgChart.pts} fill="none" stroke={svgChart.color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
            {/* X axis labels — show first, middle, last */}
            {[0, Math.floor((data.length-1)/2), data.length-1].map(i=>(
              <text key={i} x={svgChart.xScale(i)} y={H-4} textAnchor="middle" fill="#475569" fontSize="9">{data[i].date}</text>
            ))}
            {/* Hover dots */}
            {data.map((d,i)=>(
              <circle key={i} cx={svgChart.xScale(i)} cy={svgChart.yScale(d.pnl)} r="12" fill="transparent"
                onMouseEnter={()=>setTooltip({x:svgChart.xScale(i),y:svgChart.yScale(d.pnl),d})}
                onMouseLeave={()=>setTooltip(null)} style={{cursor:"pointer"}}/>
            ))}
            {/* Visible dot on hover */}
            {tooltip&&<circle cx={tooltip.x} cy={tooltip.y} r="4" fill={svgChart.color} stroke="#111827" strokeWidth="2"/>}
          </svg>
          {/* Tooltip */}
          {tooltip&&(
            <div style={{position:"absolute",left:Math.min(tooltip.x/W*100,75)+"%",top:Math.max(0,tooltip.y-60)+"px",background:"#1e293b",border:"1px solid #334155",borderRadius:8,padding:"8px 12px",fontSize:11,pointerEvents:"none",whiteSpace:"nowrap",zIndex:10}}>
              <div style={{color:"#64748b",marginBottom:2}}>{tooltip.d.date}</div>
              {tooltip.d.bet&&<div style={{color:"#94a3b8",marginBottom:2,maxWidth:160,overflow:"hidden",textOverflow:"ellipsis"}}>{tooltip.d.bet}</div>}
              <div style={{color:tooltip.d.pnl>=0?"#4ade80":"#f87171",fontWeight:700}}>{(tooltip.d.pnl>=0?"+":"")+fmt(tooltip.d.pnl)}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Bracket ───────────────────────────────────────────────────────────────────
function BracketTab({ fixturesByComp }) {
  const wcMatches = fixturesByComp[2000] || [];

  // Group knockout matches by round
  const rounds = useMemo(() => {
    const knockout = wcMatches.filter(m =>
      m.stage && !m.stage.includes("GROUP") && m.stage !== "PRELIMINARY_ROUND"
    );
    const byRound = {};
    knockout.forEach(m => {
      const r = m.stage || "UNKNOWN";
      if (!byRound[r]) byRound[r] = [];
      byRound[r].push(m);
    });
    return byRound;
  }, [wcMatches]);

  const roundOrder = ["ROUND_OF_32","ROUND_OF_16","QUARTER_FINALS","SEMI_FINALS","THIRD_PLACE","FINAL"];
  const roundLabels = {
    "ROUND_OF_32": "Round of 32",
    "ROUND_OF_16": "Round of 16",
    "QUARTER_FINALS": "Quarter Finals",
    "SEMI_FINALS": "Semi Finals",
    "THIRD_PLACE": "3rd Place",
    "FINAL": "Final"
  };

  const hasKnockout = Object.keys(rounds).length > 0;

  const scoreDisplay = (m) => {
    if (["FINISHED","IN_PLAY","PAUSED"].includes(m.status)) {
      const h = m.score?.fullTime?.home;
      const a = m.score?.fullTime?.away;
      if (h !== null && h !== undefined && a !== null && a !== undefined) return h + " - " + a;
    }
    if (m.utcDate) return new Date(m.utcDate).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    return "TBD";
  };

  if (!hasKnockout) {
    return (
      <div>
        <div style={{fontSize:14,fontWeight:600,color:"#f1f5f9",marginBottom:6}}>Tournament Bracket</div>
        <div style={{fontSize:13,color:"#64748b",marginBottom:20}}>The knockout bracket will appear here once the World Cup group stage is complete.</div>
        <div style={{background:"#111827",border:"1px solid #1e293b",borderRadius:12,padding:32,textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:12}}>🏆</div>
          <div style={{fontSize:15,fontWeight:600,color:"#475569",marginBottom:8}}>Bracket not yet available</div>
          <div style={{fontSize:13,color:"#334155"}}>The 2026 World Cup group stage runs June–July 2026. Check back once knockout fixtures are confirmed.</div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{fontSize:14,fontWeight:600,color:"#f1f5f9",marginBottom:16}}>Tournament Bracket</div>
      <div style={{overflowX:"auto"}}>
        <div style={{display:"flex",gap:16,minWidth:600}}>
          {roundOrder.filter(r=>rounds[r]).map(round => (
            <div key={round} style={{flex:1,minWidth:140}}>
              <div style={{fontSize:10,color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:10,textAlign:"center"}}>{roundLabels[round]||round}</div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {rounds[round].map(m => {
                  const home = m.homeTeam?.shortName||m.homeTeam?.name||"TBD";
                  const away = m.awayTeam?.shortName||m.awayTeam?.name||"TBD";
                  const isLive = m.status==="IN_PLAY"||m.status==="PAUSED";
                  const isFinished = m.status==="FINISHED";
                  const homeWon = isFinished && m.score?.fullTime?.home > m.score?.fullTime?.away;
                  const awayWon = isFinished && m.score?.fullTime?.away > m.score?.fullTime?.home;
                  return (
                    <div key={m.id} style={{background:"#111827",border:"1px solid "+(isLive?"#3a1a1a":"#1e293b"),borderRadius:8,overflow:"hidden"}}>
                      <div style={{padding:"6px 10px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #0b0e14"}}>
                        <span style={{fontSize:12,fontWeight:600,color:homeWon?"#4ade80":"#f1f5f9"}}>{home}</span>
                        <span style={{fontSize:11,color:isLive?"#f87171":isFinished?"#4ade80":"#475569",fontWeight:600,minWidth:30,textAlign:"center"}}>{scoreDisplay(m).split(" - ")[0]||""}</span>
                      </div>
                      <div style={{padding:"6px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <span style={{fontSize:12,fontWeight:600,color:awayWon?"#4ade80":"#f1f5f9"}}>{away}</span>
                        <span style={{fontSize:11,color:isLive?"#f87171":isFinished?"#4ade80":"#475569",fontWeight:600,minWidth:30,textAlign:"center"}}>{scoreDisplay(m).split(" - ")[1]||""}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Fixture Modal ─────────────────────────────────────────────────────────────
function FixtureModal({ match, comp, onClose, onQuickAdd }) {
  const [prediction, setPrediction] = useState(null);
  const [predLoading, setPredLoading] = useState(true);
  const [predError, setPredError] = useState(null);
  const [oddsData, setOddsData] = useState(null);
  const [oddsLoading, setOddsLoading] = useState(true);
  const [addedBet, setAddedBet] = useState(false);

  const home = (match.homeTeam&&(match.homeTeam.shortName||match.homeTeam.name))||"Home";
  const away = (match.awayTeam&&(match.awayTeam.shortName||match.awayTeam.name))||"Away";
  const ko = match.utcDate ? new Date(match.utcDate).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"}) : "--";
  const matchDate = match.utcDate ? new Date(match.utcDate).toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
  const isLive = match.status==="IN_PLAY"||match.status==="PAUSED";
  const isFinished = match.status==="FINISHED";

  const scoreDisplay = () => {
    if (isFinished||isLive) {
      const h = match.score?.fullTime?.home;
      const a = match.score?.fullTime?.away;
      if (h!==null&&h!==undefined&&a!==null&&a!==undefined) return h+" - "+a;
    }
    return null;
  };

  useEffect(() => {
    (async () => {
      setPredLoading(true); setPredError(null);
      try {
        const res = await fetch("/api/predict", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ home, away, competition: comp.name })
        });
        if (!res.ok) throw new Error("Prediction unavailable");
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        setPrediction(data);
      } catch(e) { setPredError("Could not load prediction: "+e.message); }
      finally { setPredLoading(false); }
    })();
    (async () => {
      setOddsLoading(true);
      try {
        const res = await fetch("/api/odds", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ home, away })
        });
        if (res.ok) { const data = await res.json(); setOddsData(data); }
      } catch(e) {}
      finally { setOddsLoading(false); }
    })();
  }, []);

  const bestOdds = useMemo(() => {
    if (!oddsData||!oddsData.bookmakers) return null;
    const out = { home:[], draw:[], away:[] };
    oddsData.bookmakers.forEach(bm => {
      const market = bm.markets?.find(m=>m.key==="h2h");
      if (!market) return;
      market.outcomes.forEach(o => {
        const key = o.name===oddsData.home_team?"home":o.name===oddsData.away_team?"away":"draw";
        if (out[key]) out[key].push({ book:bm.title, price:o.price });
      });
    });
    ["home","draw","away"].forEach(k=>out[k].sort((a,b)=>b.price-a.price));
    return out;
  }, [oddsData]);

  const confColor = c => c==="High"?"#4ade80":c==="Medium"?"#fbbf24":"#f87171";
  const winnerColor = w => w==="Home"?"#7eb8f7":w==="Away"?"#f87171":"#a1a1aa";

  const handleQuickAdd = (selection, odds) => {
    onQuickAdd({
      match: home + " vs " + away,
      selection,
      odds: String(odds),
      date: matchDate,
    });
    setAddedBet(true);
    setTimeout(onClose, 800);
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>

// ── Fixtures Tab ──────────────────────────────────────────────────────────────
function FixturesTab({ onQuickAdd, onFixturesLoaded }) {
  const today = new Date().toISOString().slice(0,10);
  const [date, setDate] = useState(today);
  const [matches, setMatches] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [compFilter, setCompFilter] = useState(null);
  const [selectedMatch, setSelectedMatch] = useState(null);

  const fetchMatches = useCallback(async (d) => {
    setLoading(true); setError(null);
    const all = [];
    for (let i=0; i<COMPS.length; i++) {
      try {
        const res = await fetch("/api/fixtures", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ comp:COMPS[i], date:d, delay: i*500 })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.matches&&data.matches.length>0) data.matches.forEach(m=>all.push({match:m,comp:data.competition}));
        }
      } catch(e) {}
    }
    setMatches(all);
    setLastUpdated(new Date());
    if (all.length===0) setError("No matches found.");
    if (onFixturesLoaded) onFixturesLoaded(all);
    setLoading(false);
  }, []);

  useEffect(() => {
    fetchMatches(date);
    if (date===today) {
      const t = setInterval(()=>fetchMatches(date),60000);
      return ()=>clearInterval(t);
    }
  }, [date, fetchMatches]);

  const competitions = useMemo(()=>{
    const seen={};
    return matches.reduce((acc,m)=>{ if(!seen[m.comp.id]){seen[m.comp.id]=true;acc.push(m.comp);} return acc; },[]);
  },[matches]);

  const filtered = compFilter ? matches.filter(m=>m.comp.id===compFilter) : matches;
  const koTime = (utcDate) => utcDate ? new Date(utcDate).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"}) : "--";
  const scoreDisplay = (m) => {
    if (["FINISHED","IN_PLAY","PAUSED"].includes(m.status)) {
      const h=m.score?.fullTime?.home; const a=m.score?.fullTime?.away;
      if (h!==null&&h!==undefined&&a!==null&&a!==undefined) return h+" - "+a;
    }
    return koTime(m.utcDate);
  };
  const statusLabel = (m) => { if(m.status==="IN_PLAY")return"LIVE"; if(m.status==="PAUSED")return"HT"; if(m.status==="FINISHED")return"FT"; if(m.status==="POSTPONED")return"PP"; return"KO"; };
  const isLive = m => m.status==="IN_PLAY"||m.status==="PAUSED";
  const isFinished = m => m.status==="FINISHED";

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12,marginBottom:18}}>
        <button onClick={()=>{setDate(addDays(date,-1));setCompFilter(null);}} style={{background:"#111827",border:"1px solid #1e293b",color:"#64748b",borderRadius:8,width:36,height:36,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
        <div style={{textAlign:"center",minWidth:160}}>
          <div style={{fontSize:16,fontWeight:700,color:"#f1f5f9"}}>{displayDate(date)}</div>
          <div style={{fontSize:11,color:"#475569",marginTop:2}}>{new Date(date).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</div>
        </div>
        <button onClick={()=>{setDate(addDays(date,1));setCompFilter(null);}} style={{background:"#111827",border:"1px solid #1e293b",color:"#64748b",borderRadius:8,width:36,height:36,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
        {date!==today&&<button onClick={()=>{setDate(today);setCompFilter(null);}} style={{background:"#1e293b",border:"none",color:"#94a3b8",borderRadius:7,padding:"5px 12px",fontSize:11,cursor:"pointer",fontWeight:600}}>Today</button>}
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <button onClick={()=>setCompFilter(null)} style={{padding:"4px 12px",borderRadius:16,border:"none",fontSize:11,fontWeight:600,cursor:"pointer",background:compFilter===null?"#2563eb":"#111827",color:compFilter===null?"#fff":"#64748b"}}>All</button>
          {competitions.map(c=>(
            <button key={c.id} onClick={()=>setCompFilter(c.id)} style={{padding:"4px 12px",borderRadius:16,border:"none",fontSize:11,fontWeight:600,cursor:"pointer",background:compFilter===c.id?"#2563eb":"#111827",color:compFilter===c.id?"#fff":"#64748b"}}>{c.name}</button>
          ))}
        </div>
        <button onClick={()=>fetchMatches(date)} disabled={loading} style={{background:"#111827",color:"#64748b",border:"1px solid #1e293b",borderRadius:7,padding:"4px 12px",fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
          <span className={loading?"spin":""}>↻</span>{loading?"Loading...":"Refresh"}
        </button>
      </div>

      {lastUpdated&&date===today&&<div style={{fontSize:11,color:"#334155",marginBottom:14}}>{"Updated "+lastUpdated.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" · Auto-refreshes every 60s"}</div>}
      {loading&&matches.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:"#334155"}}><div className="spin" style={{fontSize:24,marginBottom:10}}>↻</div><div style={{fontSize:13}}>Loading fixtures...</div></div>}
      {!loading&&error&&<div style={{textAlign:"center",padding:"40px 0",color:"#475569"}}><div style={{fontSize:32,marginBottom:10}}>📅</div><div style={{fontSize:14,fontWeight:500}}>{error}</div><div style={{fontSize:12,marginTop:6,color:"#334155"}}>No fixtures scheduled for this day</div></div>}

      {competitions.filter(c=>!compFilter||c.id===compFilter).map(comp=>{
        const cm = filtered.filter(m=>m.comp.id===comp.id);
        if (!cm.length) return null;
        return (
          <div key={comp.id} style={{marginBottom:20}}>
            <div style={{fontSize:11,color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8,display:"flex",alignItems:"center",gap:8}}>
              {comp.name}
              {cm.some(m=>isLive(m.match))&&<span style={{background:"#3a0f0f",color:"#f87171",borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:700}}>LIVE</span>}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {cm.map(({match:m,comp:c})=>{
                const live=isLive(m), finished=isFinished(m);
                const home=(m.homeTeam&&(m.homeTeam.shortName||m.homeTeam.name))||"Home";
                const away=(m.awayTeam&&(m.awayTeam.shortName||m.awayTeam.name))||"Away";
                return (
                  <div key={m.id} onClick={()=>setSelectedMatch({match:m,comp:c})}
                    style={{background:"#111827",border:"1px solid "+(live?"#3a1a1a":finished?"#1a2a1a":"#1e293b"),borderRadius:9,padding:"12px 16px",display:"grid",gridTemplateColumns:"1fr auto 1fr",alignItems:"center",gap:8,cursor:"pointer"}}
                    onMouseEnter={e=>e.currentTarget.style.borderColor="#2563eb"}
                    onMouseLeave={e=>e.currentTarget.style.borderColor=(live?"#3a1a1a":finished?"#1a2a1a":"#1e293b")}>
                    <div style={{textAlign:"right"}}><div style={{fontSize:13,fontWeight:600,color:"#f1f5f9"}}>{home}</div></div>
                    <div style={{textAlign:"center",minWidth:90}}>
                      <div style={{fontSize:(live||finished)?20:14,fontWeight:700,color:live?"#f87171":finished?"#94a3b8":"#475569",fontVariantNumeric:"tabular-nums"}}>{scoreDisplay(m)}</div>
                      <div style={{fontSize:10,fontWeight:600,marginTop:2,color:live?"#f87171":finished?"#4ade80":"#475569",textTransform:"uppercase",letterSpacing:"0.06em"}}>{live?"● LIVE":statusLabel(m)}</div>
                      <div style={{fontSize:9,color:"#334155",marginTop:3}}>tap for details</div>
                    </div>
                    <div style={{textAlign:"left"}}><div style={{fontSize:13,fontWeight:600,color:"#f1f5f9"}}>{away}</div></div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {selectedMatch&&(
        <FixtureModal
          match={selectedMatch.match}
          comp={selectedMatch.comp}
          onClose={()=>setSelectedMatch(null)}
          onQuickAdd={(prefill) => { onQuickAdd(prefill); setSelectedMatch(null); }}
        />
      )}
    </div>
  );
}

// ── Auth ──────────────────────────────────────────────────────────────────────
function AuthScreen({ onAuth }) {
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [message,setMessage]=useState(null);
  const inp={background:"#0b0e14",border:"1px solid #1e293b",borderRadius:8,padding:"10px 14px",color:"#f1f5f9",fontSize:14,width:"100%",marginTop:6};
  const handle=async()=>{
    setError(null);setMessage(null);setLoading(true);
    try {
      if(mode==="forgot"){const{error}=await sb.auth.resetPasswordForEmail(email);if(error)throw error;setMessage("Password reset email sent.");}
      else if(mode==="register"){const{data,error}=await sb.auth.signUp({email,password});if(error)throw error;if(data.session)onAuth(data.session.user);else setMessage("Check your email to confirm, then log in.");}
      else{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;onAuth(data.user);}
    }catch(e){setError(e.message);}finally{setLoading(false);}
  };
  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <div style={{background:"linear-gradient(135deg,#0d1b2e 0%,#0b0e14 100%)",borderBottom:"1px solid #1e293b",padding:"20px 28px",display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontSize:28}}>🏆</span>
        <div><div style={{fontSize:18,fontWeight:700,color:"#f1f5f9"}}>World Cup Bet Tracker</div><div style={{fontSize:12,color:"#64748b",marginTop:1}}>2026 · USA · Canada · Mexico</div></div>
      </div>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
        <div style={{background:"#111827",border:"1px solid #1e293b",borderRadius:14,padding:32,width:"100%",maxWidth:400}}>
          <div style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>{mode==="login"?"Welcome back":mode==="register"?"Create account":"Reset password"}</div>
          <div style={{fontSize:13,color:"#64748b",marginBottom:24}}>{mode==="login"?"Sign in to your bet tracker":mode==="register"?"Your bets stay private to you":"We'll email you a reset link"}</div>
          {error&&<div style={{background:"#3a0f0f",border:"1px solid #7f1d1d",borderRadius:7,padding:"10px 14px",fontSize:12,color:"#fca5a5",marginBottom:16}}>{error}</div>}
          {message&&<div style={{background:"#0d3320",border:"1px solid #14532d",borderRadius:7,padding:"10px 14px",fontSize:12,color:"#86efac",marginBottom:16}}>{message}</div>}
          <div style={{marginBottom:14}}><label style={{fontSize:11,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.06em"}}>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" onKeyDown={e=>e.key==="Enter"&&handle()} style={inp} /></div>
          {mode!=="forgot"&&<div style={{marginBottom:20}}><label style={{fontSize:11,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.06em"}}>Password</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&handle()} style={inp} /></div>}
          <button onClick={handle} disabled={loading} style={{width:"100%",background:loading?"#1e3a5f":"#2563eb",color:"#fff",border:"none",borderRadius:8,padding:"11px 0",fontSize:14,fontWeight:600,cursor:loading?"default":"pointer",marginBottom:16}}>
            {loading?"...":mode==="login"?"Sign In":mode==="register"?"Create Account":"Send Reset Email"}
          </button>
          <div style={{display:"flex",flexDirection:"column",gap:8,alignItems:"center"}}>
            {mode==="login"&&<React.Fragment><span style={{fontSize:12,color:"#475569"}}>{"Don't have an account? "}<span style={{color:"#60a5fa",cursor:"pointer"}} onClick={()=>{setMode("register");setError(null);setMessage(null);}}>Register</span></span><span style={{fontSize:12,color:"#475569",cursor:"pointer"}} onClick={()=>{setMode("forgot");setError(null);setMessage(null);}}>Forgot password?</span></React.Fragment>}
            {mode==="register"&&<span style={{fontSize:12,color:"#475569"}}>{"Already have an account? "}<span style={{color:"#60a5fa",cursor:"pointer"}} onClick={()=>{setMode("login");setError(null);setMessage(null);}}>Sign in</span></span>}

          </div>
        </div>
      </div>
    </div>
  );
}

function Tracker({ user, onSignOut }) {
  const [bets,setBets]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState(emptyForm);
  const [editId,setEditId]=useState(null);
  const [filterStatus,setFilterStatus]=useState("All");
  const [sortBy,setSortBy]=useState("date");
  const [activeTab,setActiveTab]=useState("bets");
  const [deposited,setDeposited]=useState(0);
  const [showChart,setShowChart]=useState(false);
  const [wcFixtures,setWcFixtures]=useState({});

  useEffect(()=>{
    (async()=>{
      try{
        const{data,error}=await sb.from("bets").select("*").eq("user_id",user.id).order("created_at",{ascending:false});
        if(error)throw error;
        setBets(data.map(fromDb));
        // Load deposited amount from localStorage per user
        const saved = localStorage.getItem("deposited_"+user.id);
        if (saved) setDeposited(parseFloat(saved)||0);
      }catch(e){setError("Could not load bets: "+e.message);}finally{setLoading(false);}
    })();
  },[user.id]);

  const saveDeposited = (val) => {
    setDeposited(val);
    localStorage.setItem("deposited_"+user.id, String(val));
  };

  const stats=useMemo(()=>calcStats(bets),[bets]);
  const filtered=useMemo(()=>{
    let list=filterStatus==="All"?bets:bets.filter(b=>b.status===filterStatus);
    return [...list].sort((a,b)=>{
      if(sortBy==="date")return new Date(b.date)-new Date(a.date);
      if(sortBy==="stake")return parseFloat(b.stake)-parseFloat(a.stake);
      if(sortBy==="odds")return parseFloat(b.odds)-parseFloat(a.odds);
      return 0;
    });
  },[bets,filterStatus,sortBy]);

  const setF=(k,v)=>setForm(p=>({...p,[k]:v}));
  const accaOdds=useMemo(()=>{
    if(!form.isAccumulator||!form.legs.length)return null;
    if(!form.legs.every(l=>l.odds&&!isNaN(parseFloat(l.odds))))return null;
    return form.legs.reduce((acc,leg)=>acc*parseFloat(leg.odds),1).toFixed(2);
  },[form.legs,form.isAccumulator]);
  const effectiveOdds=form.isAccumulator?(accaOdds||form.odds):form.odds;
  const potReturn=parseFloat(form.stake||0)*parseFloat(effectiveOdds||0);

  const updateLeg=(i,k,v)=>{const legs=[...form.legs];legs[i]={...legs[i],[k]:v};setForm(p=>({...p,legs}));};
  const addLeg=()=>setForm(p=>({...p,legs:[...p.legs,{match:"",selection:"",odds:""}]}));
  const removeLeg=(i)=>setForm(p=>({...p,legs:p.legs.filter((_,idx)=>idx!==i)}));

  const handleSubmit=async()=>{
    if(!form.match||!form.stake)return;if(!form.isAccumulator&&!form.odds)return;
    const finalOdds=form.isAccumulator?(accaOdds||form.odds):form.odds;
    const bet={...form,odds:finalOdds,id:editId||Date.now(),potentialReturn:(parseFloat(form.stake||0)*parseFloat(finalOdds||0)).toFixed(2)};
    setSaving(true);setError(null);
    try{
      if(editId){const{error}=await sb.from("bets").update(toDb(bet,user.id)).eq("id",editId).eq("user_id",user.id);if(error)throw error;setBets(prev=>prev.map(b=>b.id===editId?bet:b));}
      else{const{data,error}=await sb.from("bets").insert(toDb(bet,user.id)).select();if(error)throw error;setBets(prev=>[fromDb(data[0]),...prev]);}
      setForm(emptyForm);setShowForm(false);setEditId(null);
    }catch(e){setError("Save failed: "+e.message);}finally{setSaving(false);}
  };

  const handleEdit=(bet)=>{setForm({...bet});setEditId(bet.id);setShowForm(true);};
  const handleDelete=async(id)=>{
    setSaving(true);
    try{const{error}=await sb.from("bets").delete().eq("id",id).eq("user_id",user.id);if(error)throw error;setBets(prev=>prev.filter(b=>b.id!==id));}
    catch(e){setError("Delete failed: "+e.message);}finally{setSaving(false);}
  };
  const quickStatus=async(id,status)=>{
    const bet=bets.find(b=>b.id===id);if(!bet)return;
    const extra=status==="Won"?{returns:(parseFloat(bet.stake)*parseFloat(bet.odds)).toFixed(2)}:{};
    const updated={...bet,status,...extra};setSaving(true);
    try{const{error}=await sb.from("bets").update(toDb(updated,user.id)).eq("id",id).eq("user_id",user.id);if(error)throw error;setBets(prev=>prev.map(b=>b.id===id?updated:b));}
    catch(e){setError("Update failed: "+e.message);}finally{setSaving(false);}
  };

  // Quick add from fixture — prefill form and switch to bets tab
  const handleQuickAdd = (prefill) => {
    setForm({ ...emptyForm, ...prefill });
    setActiveTab("bets");
    setShowForm(true);
    setEditId(null);
  };

  const inp={background:"#0b0e14",border:"1px solid #1e293b",borderRadius:7,padding:"8px 11px",color:"#f1f5f9",fontSize:13,width:"100%"};
  const smInp={background:"#0b0e14",border:"1px solid #1e293b",borderRadius:6,padding:"6px 9px",color:"#f1f5f9",fontSize:12,width:"100%"};

  const TABS = [
    { id:"bets", label:"My Bets" },
    { id:"fixtures", label:"Fixtures" },
    { id:"bracket", label:"🏆 Bracket" },
  ];

  return (
    <div style={{minHeight:"100vh"}}>
      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#0d1b2e 0%,#0b0e14 100%)",borderBottom:"1px solid #1e293b",padding:"16px 28px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:28}}>🏆</span>
          <div><div style={{fontSize:18,fontWeight:700,letterSpacing:"-0.02em",color:"#f1f5f9"}}>World Cup Bet Tracker</div><div style={{fontSize:12,color:"#64748b",marginTop:1}}>2026 · USA · Canada · Mexico</div></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          {saving&&<span style={{fontSize:11,color:"#475569",display:"flex",alignItems:"center",gap:5}}><span className="spin">↻</span> Saving...</span>}
          {!saving&&!loading&&<span style={{fontSize:11,color:"#166534"}}>● Synced</span>}
          <div style={{fontSize:12,borderLeft:"1px solid #1e293b",paddingLeft:14}}>
            <span style={{color:"#64748b"}}>{user.email}</span>
            <span style={{marginLeft:10,color:"#60a5fa",cursor:"pointer"}} onClick={onSignOut}>Sign out</span>
          </div>
          {activeTab==="bets"&&(
            <button onClick={()=>{setShowForm(!showForm);setEditId(null);setForm(emptyForm);}} style={{background:showForm?"#1e293b":"#2563eb",color:"#fff",border:"none",borderRadius:8,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{showForm?"✕ Cancel":"+ Add Bet"}</button>
          )}
        </div>
      </div>

      {error&&<div style={{background:"#3a0f0f",borderBottom:"1px solid #7f1d1d",padding:"10px 28px",fontSize:12,color:"#fca5a5",display:"flex",justifyContent:"space-between"}}><span>{"⚠ "+error}</span><span style={{cursor:"pointer"}} onClick={()=>setError(null)}>✕</span></div>}

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:1,background:"#1e293b",borderBottom:"1px solid #1e293b"}}>
        {[
          {label:"Total Bets",value:String(stats.total)},
          {label:"Cash Staked",value:fmt(stats.cashStaked)},
          {label:"Free Bets",value:fmt(stats.freeStaked),sub:bets.filter(b=>b.freeBet).length+" bets"},
          {label:"P&L",value:(stats.pnl>=0?"+":"")+fmt(stats.pnl),color:stats.pnl>=0?"#4ade80":"#f87171",clickable:true},
          {label:"Win Rate",value:stats.winRate+"%",sub:stats.won+"/"+stats.settled+" settled"},
        ].map((s,i)=>(
          <div key={i} onClick={s.clickable?()=>setShowChart(!showChart):undefined}
            style={{background:"#0b0e14",padding:"14px 20px",cursor:s.clickable?"pointer":"default",transition:"background 0.15s"}}
            onMouseEnter={e=>{if(s.clickable)e.currentTarget.style.background="#0d1420";}}
            onMouseLeave={e=>{if(s.clickable)e.currentTarget.style.background="#0b0e14";}}>
            <div style={{fontSize:11,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>{s.label}{s.clickable&&<span style={{marginLeft:6,fontSize:9,color:"#334155"}}>{showChart?"▲":"▼"}</span>}</div>
            <div style={{fontSize:20,fontWeight:700,color:s.color||"#f1f5f9",fontVariantNumeric:"tabular-nums"}}>{s.value}</div>
            {s.sub&&<div style={{fontSize:11,color:"#475569",marginTop:2}}>{s.sub}</div>}
          </div>
        ))}
      </div>

      {/* P&L Chart (collapsible) */}
      {showChart&&(
        <div style={{padding:"16px 28px 0"}}>
          <PnlChart bets={bets} deposited={deposited} onUpdateDeposited={saveDeposited} />
        </div>
      )}

      {/* Tabs */}
      <div style={{padding:"16px 28px 0",display:"flex",gap:8,borderBottom:"1px solid #1e293b"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setActiveTab(t.id)}
            style={{padding:"8px 18px",border:"none",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",background:activeTab===t.id?"#2563eb":"#111827",color:activeTab===t.id?"#fff":"#64748b"}}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={{padding:"20px 28px"}}>
        {activeTab==="fixtures"&&<FixturesTab onQuickAdd={handleQuickAdd} onFixturesLoaded={matches=>{
          const byComp={};
          matches.forEach(({match:m,comp:c})=>{ if(!byComp[c.id])byComp[c.id]=[]; byComp[c.id].push(m); });
          setWcFixtures(byComp);
        }} />}

        {activeTab==="bracket"&&<BracketTab fixturesByComp={wcFixtures} />}

        {activeTab==="bets"&&loading&&<div style={{textAlign:"center",padding:"60px 0",color:"#334155"}}><div className="spin" style={{fontSize:24,marginBottom:12}}>↻</div><div style={{fontSize:13}}>Loading bets...</div></div>}

        {activeTab==="bets"&&!loading&&(
          <div>
            {showForm&&(
              <div style={{background:"#111827",border:"1px solid #1e293b",borderRadius:12,padding:22,marginBottom:22}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
                  <div style={{fontSize:14,fontWeight:600,color:"#94a3b8"}}>{editId?"Edit Bet":"New Bet"}</div>
                  <div style={{display:"flex",gap:20}}>
                    <Toggle value={form.isAccumulator} label="Accumulator" color="#7c3aed" onChange={v=>setForm(p=>({...p,isAccumulator:v,legs:v&&p.legs.length===0?[{match:"",selection:"",odds:""},{match:"",selection:"",odds:""}]:p.legs}))} />
                    <Toggle value={form.freeBet} label="Free Bet" color="#0891b2" onChange={v=>setF("freeBet",v)} />
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
                  <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"}}>{form.isAccumulator?"Acca Name *":"Match *"}</label><input type="text" value={form.match} placeholder={form.isAccumulator?"e.g. WC Group Stage 4-fold":"e.g. England vs France"} onChange={e=>setF("match",e.target.value)} style={inp} /></div>
                  {!form.isAccumulator&&<div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"}}>Selection *</label><input type="text" value={form.selection} placeholder="e.g. England to Win" onChange={e=>setF("selection",e.target.value)} style={inp} /></div>}
                  <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"}}>Date</label><input type="date" value={form.date} onChange={e=>setF("date",e.target.value)} style={inp} /></div>
                  {!form.isAccumulator&&<div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"}}>Bet Type</label><select value={form.betType} onChange={e=>setF("betType",e.target.value)} style={inp}>{BET_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>}
                  {!form.isAccumulator&&<div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"}}>Odds (Decimal) *</label><input type="number" step="0.01" value={form.odds} placeholder="2.50" onChange={e=>setF("odds",e.target.value)} style={inp} /></div>}
                  <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"}}>{form.freeBet?"Free Bet Stake (£) *":"Stake (£) *"}</label><input type="number" step="0.01" value={form.stake} placeholder="10.00" onChange={e=>setF("stake",e.target.value)} style={{...inp,borderColor:form.freeBet?"#0891b2":"#1e293b"}} /></div>
                  <div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"}}>Status</label><select value={form.status} onChange={e=>setF("status",e.target.value)} style={inp}>{STATUSES.map(s=><option key={s}>{s}</option>)}</select></div>
                  {(form.status==="Won"||form.status==="Cash Out")&&<div><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"}}>Actual Returns (£)</label><input type="number" step="0.01" value={form.returns} placeholder={potReturn.toFixed(2)} onChange={e=>setF("returns",e.target.value)} style={inp} /></div>}
                  <div style={{gridColumn:"1 / -1"}}><label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"}}>Notes</label><input type="text" value={form.notes} placeholder="Optional notes..." onChange={e=>setF("notes",e.target.value)} style={inp} /></div>
                </div>
                {form.isAccumulator&&(
                  <div style={{marginTop:16}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                      <div style={{fontSize:12,color:"#7c3aed",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em"}}>{"Legs ("+form.legs.length+")"}{accaOdds&&<span style={{color:"#94a3b8",fontWeight:400}}>{" · Combined: "+accaOdds}</span>}</div>
                      <button onClick={addLeg} style={{background:"#1e1030",color:"#7c3aed",border:"1px solid #3b0f8f",borderRadius:6,padding:"4px 12px",fontSize:11,cursor:"pointer",fontWeight:600}}>+ Add Leg</button>
                    </div>
                    {form.legs.map((leg,i)=>(
                      <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 2fr 1fr auto",gap:8,alignItems:"end",background:"#0b0e14",borderRadius:8,padding:"10px 12px",border:"1px solid #1e293b",marginBottom:8}}>
                        <div>{i===0&&<label style={{fontSize:10,color:"#475569",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em"}}>Match</label>}<input type="text" value={leg.match} placeholder="e.g. Brazil vs Argentina" onChange={e=>updateLeg(i,"match",e.target.value)} style={smInp} /></div>
                        <div>{i===0&&<label style={{fontSize:10,color:"#475569",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em"}}>Selection</label>}<input type="text" value={leg.selection} placeholder="e.g. Brazil to Win" onChange={e=>updateLeg(i,"selection",e.target.value)} style={smInp} /></div>
                        <div>{i===0&&<label style={{fontSize:10,color:"#475569",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em"}}>Odds</label>}<input type="number" step="0.01" value={leg.odds} placeholder="1.80" onChange={e=>updateLeg(i,"odds",e.target.value)} style={smInp} /></div>
                        <button onClick={()=>removeLeg(i)} style={{background:"transparent",color:"#475569",border:"none",fontSize:16,cursor:"pointer",padding:"0 4px",alignSelf:"flex-end",marginBottom:2}}>×</button>
                      </div>
                    ))}
                  </div>
                )}
                {form.stake&&(form.isAccumulator?accaOdds:form.odds)&&(
                  <div style={{marginTop:12,padding:"10px 14px",background:form.freeBet?"#041820":"#0b1120",borderRadius:7,border:"1px solid "+(form.freeBet?"#0891b2":"#1e3a5f"),fontSize:12}}>
                    {form.freeBet?<span style={{color:"#22d3ee"}}>{"🎟️ Free bet · Potential return: "}<strong>{fmt(potReturn)}</strong>{" · P&L if won: +"}<strong>{fmt(potReturn-parseFloat(form.stake||0))}</strong>{" · P&L if lost: "}<strong style={{color:"#a1a1aa"}}>£0.00</strong></span>:<span style={{color:"#7eb8f7"}}>{"Potential return: "}<strong>{fmt(potReturn)}</strong>{" · Profit: +"}<strong>{fmt(potReturn-parseFloat(form.stake||0))}</strong>{" · Implied prob: "}<strong>{((1/parseFloat(effectiveOdds))*100).toFixed(1)+"%"}</strong></span>}
                  </div>
                )}
                <div style={{marginTop:14,display:"flex",gap:10}}>
                  <button onClick={handleSubmit} disabled={saving} style={{background:saving?"#1e3a5f":"#2563eb",color:"#fff",border:"none",borderRadius:7,padding:"9px 22px",fontSize:13,fontWeight:600,cursor:saving?"default":"pointer",opacity:saving?0.7:1}}>{saving?"Saving...":editId?"Save Changes":"Add Bet"}</button>
                  <button onClick={()=>{setShowForm(false);setEditId(null);setForm(emptyForm);}} style={{background:"transparent",color:"#64748b",border:"1px solid #1e293b",borderRadius:7,padding:"9px 18px",fontSize:13,cursor:"pointer"}}>Cancel</button>
                </div>
              </div>
            )}

            <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center",justifyContent:"space-between",flexWrap:"wrap"}}>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {["All",...STATUSES].map(s=>(
                  <button key={s} onClick={()=>setFilterStatus(s)} style={{padding:"5px 13px",borderRadius:20,border:"none",fontSize:12,fontWeight:500,cursor:"pointer",background:filterStatus===s?"#2563eb":"#111827",color:filterStatus===s?"#fff":"#64748b"}}>
                    {s+" ("+(s==="All"?bets.length:bets.filter(b=>b.status===s).length)+")"}
                  </button>
                ))}
              </div>
              <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{background:"#111827",border:"1px solid #1e293b",borderRadius:7,padding:"5px 11px",color:"#94a3b8",fontSize:12,cursor:"pointer"}}>
                <option value="date">Sort: Date</option><option value="stake">Sort: Stake</option><option value="odds">Sort: Odds</option>
              </select>
            </div>

            {filtered.length===0?(
              <div style={{textAlign:"center",padding:"60px 0",color:"#334155"}}><div style={{fontSize:40,marginBottom:12}}>⚽</div><div style={{fontSize:15,fontWeight:500}}>No bets yet</div><div style={{fontSize:13,marginTop:6}}>Add your first bet to start tracking</div></div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {filtered.map(bet=>{
                  const pnl=calcPnl(bet);
                  return (
                    <div key={bet.id} style={{background:"#111827",border:"1px solid "+(bet.isAccumulator?"#2d1a5e":"#1e293b"),borderRadius:10,padding:"14px 18px",display:"grid",gridTemplateColumns:"1fr auto",alignItems:"start",gap:12}}>
                      <div>
                        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:5}}>
                          {bet.isAccumulator&&<span style={{fontSize:10,background:"#1e1030",color:"#a78bfa",borderRadius:4,padding:"2px 6px",fontWeight:600}}>{"ACCA "+(bet.legs&&bet.legs.length?bet.legs.length:"")+"✕"}</span>}
                          {bet.freeBet&&<span style={{fontSize:10,background:"#041820",color:"#22d3ee",borderRadius:4,padding:"2px 6px",fontWeight:600}}>FREE BET</span>}
                          <span style={{fontSize:14,fontWeight:600,color:"#f1f5f9"}}>{bet.match}</span>
                          {bet.selection&&<React.Fragment><span style={{fontSize:11,color:"#475569"}}>·</span><span style={{fontSize:12,color:"#94a3b8"}}>{bet.selection}</span></React.Fragment>}
                        </div>
                        {bet.isAccumulator&&bet.legs&&bet.legs.length>0&&(
                          <div style={{marginBottom:6,display:"flex",flexDirection:"column",gap:3}}>
                            {bet.legs.map((leg,i)=>(
                              <div key={i} style={{fontSize:11,color:"#64748b",display:"flex",gap:6}}>
                                <span style={{color:"#475569"}}>{(i+1)+"."}</span><span>{leg.match}</span><span style={{color:"#334155"}}>—</span><span style={{color:"#94a3b8"}}>{leg.selection}</span>{leg.odds&&<span style={{color:"#475569"}}>{"@ "+leg.odds}</span>}
                              </div>
                            ))}
                          </div>
                        )}
                        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                          {!bet.isAccumulator&&<span style={{fontSize:11,background:"#1e293b",color:"#64748b",borderRadius:4,padding:"2px 7px"}}>{bet.betType}</span>}
                          <span style={{fontSize:12,color:"#94a3b8"}}>{"@ "}<strong style={{color:"#f1f5f9"}}>{parseFloat(bet.odds).toFixed(2)}</strong></span>
                          <span style={{fontSize:12,color:"#94a3b8"}}>{bet.freeBet?"Free Bet: ":"Stake: "}<strong style={{color:bet.freeBet?"#22d3ee":"#f1f5f9"}}>{fmt(bet.stake)}</strong></span>
                          {pnl!==null&&<span style={{fontSize:12,fontWeight:600,color:pnl>=0?"#4ade80":"#f87171"}}>{(pnl>=0?"+":"")+fmt(pnl)}</span>}
                          {bet.status==="Pending"&&<span style={{fontSize:11,color:"#475569"}}>{"Pot: "+fmt(bet.potentialReturn)}</span>}
                          <span style={{fontSize:11,color:"#334155"}}>{bet.date}</span>
                        </div>
                        {bet.notes&&<div style={{fontSize:11,color:"#475569",marginTop:5,fontStyle:"italic"}}>{bet.notes}</div>}
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
                        <StatusBadge status={bet.status} />
                        <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>
                          {bet.status==="Pending"&&STATUSES.filter(s=>s!=="Pending").map(s=>(
                            <button key={s} onClick={()=>quickStatus(bet.id,s)} style={{background:"#1e293b",color:(STATUS_STYLES[s]||{}).color||"#94a3b8",border:"none",borderRadius:5,padding:"3px 8px",fontSize:10,cursor:"pointer",fontWeight:500}}>{s}</button>
                          ))}
                          <button onClick={()=>handleEdit(bet)} style={{background:"#1e293b",color:"#64748b",border:"none",borderRadius:5,padding:"3px 8px",fontSize:10,cursor:"pointer"}}>✏️</button>
                          <button onClick={()=>handleDelete(bet.id)} style={{background:"#1e293b",color:"#64748b",border:"none",borderRadius:5,padding:"3px 8px",fontSize:10,cursor:"pointer"}}>🗑️</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function Root() {
  const [user,setUser]=useState(null);
  const [checking,setChecking]=useState(true);
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setUser(session?session.user:null);setChecking(false);});
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{setUser(session?session.user:null);});
    return()=>subscription.unsubscribe();
  },[]);
  const signOut=async()=>{await sb.auth.signOut();setUser(null);};
  if(checking)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0b0e14"}}><span className="spin" style={{fontSize:24,color:"#334155"}}>↻</span></div>;
  return user?<Tracker user={user} onSignOut={signOut}/>:<AuthScreen onAuth={setUser}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
